<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    #scoreBoard {
      color: white;
      font-size: 20px;
      margin-bottom: 10px;
    }
    #startBtn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    canvas {
      background: #000;
      touch-action: none;
    }
  </style>
</head>
<body>

<div id="scoreBoard">Score: 0 | High Score: 0</div>
<button id="startBtn">Start Game</button>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreBoard = document.getElementById('scoreBoard');
  const startBtn = document.getElementById('startBtn');
  const box = 20;

  let snake, food, direction, score, highScore, speed, game, obstacles;

  function randomPosition() {
    return {
      x: Math.floor(Math.random() * 20) * box,
      y: Math.floor(Math.random() * 20) * box
    };
  }

  function generateObstacles(n = 3) {
    let obs = [];
    while (obs.length < n) {
      let pos = randomPosition();
      if (!snake.some(s => s.x === pos.x && s.y === pos.y) &&
          !(food && food.x === pos.x && food.y === pos.y)) {
        obs.push(pos);
      }
    }
    return obs;
  }

  function updateScore() {
    highScore = Math.max(score, highScore);
    localStorage.setItem('highScore', highScore);
    scoreBoard.textContent = `Score: ${score} | High Score: ${highScore}`;
  }

  function startGame() {
    snake = [{ x: 9 * box, y: 9 * box }];
    direction = 'RIGHT';
    food = randomPosition();
    score = 0;
    speed = 130; // initial speed
    highScore = parseInt(localStorage.getItem('highScore')) || 0;
    obstacles = generateObstacles();
    updateScore();
    if (game) clearInterval(game);
    game = setInterval(draw, speed);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw snake
    snake.forEach((segment, i) => {
      ctx.fillStyle = i === 0 ? 'lime' : 'white';
      ctx.fillRect(segment.x, segment.y, box, box);
    });

    // Draw food
    ctx.fillStyle = 'red';
    ctx.fillRect(food.x, food.y, box, box);

    // Draw obstacles
    ctx.fillStyle = 'gray';
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, box, box));

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === 'LEFT') headX -= box;
    if (direction === 'UP') headY -= box;
    if (direction === 'RIGHT') headX += box;
    if (direction === 'DOWN') headY += box;

    // Collision check
    if (
      headX < 0 || headX >= canvas.width ||
      headY < 0 || headY >= canvas.height ||
      snake.some(seg => seg.x === headX && seg.y === headY) ||
      obstacles.some(obs => obs.x === headX && obs.y === headY)
    ) {
      clearInterval(game);
      alert(`Game Over!\nScore: ${score}`);
      return;
    }

    if (headX === food.x && headY === food.y) {
      score++;
      updateScore();
      food = randomPosition();

      // slow speed increase
      clearInterval(game);
      speed = Math.max(60, speed - 3);
      game = setInterval(draw, speed);
    } else {
      snake.pop();
    }

    snake.unshift({ x: headX, y: headY });
  }

  function handleDirection(e) {
    if (e.key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT';
    else if (e.key === 'ArrowUp' && direction !== 'DOWN') direction = 'UP';
    else if (e.key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
    else if (e.key === 'ArrowDown' && direction !== 'UP') direction = 'DOWN';
  }

  // Mobile swipe
  let touchStartX, touchStartY;
  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });

  canvas.addEventListener('touchmove', e => {
    if (!touchStartX || !touchStartY) return;

    let dx = e.touches[0].clientX - touchStartX;
    let dy = e.touches[0].clientY - touchStartY;

    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && direction !== 'LEFT') direction = 'RIGHT';
      else if (dx < 0 && direction !== 'RIGHT') direction = 'LEFT';
    } else {
      if (dy > 0 && direction !== 'UP') direction = 'DOWN';
      else if (dy < 0 && direction !== 'DOWN') direction = 'UP';
    }

    touchStartX = null;
    touchStartY = null;
  });

  document.addEventListener('keydown', handleDirection);
  startBtn.addEventListener('click', startGame);
</script>

</body>
</html>
